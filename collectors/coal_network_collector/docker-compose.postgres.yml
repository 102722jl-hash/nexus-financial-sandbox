services:
  postgres:
    image: postgres:16-alpine
    container_name: coal-network-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: coal_network
      POSTGRES_USER: coal_network_admin
      POSTGRES_PASSWORD: ${COAL_PG_ADMIN_PASSWORD:?set COAL_PG_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - coal_network_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coal_network_admin -d coal_network"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  coal_network_postgres_data:
